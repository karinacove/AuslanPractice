<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentences Game</title>

  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================
       TOP BAR
  ========================== -->
  <div id="topBar">
    <div id="studentInfo">
      <span id="studentName"></span> |
      <span id="studentClass"></span>
    </div>

    <div id="scoreDisplay"></div>

    <button id="stopBtn" class="iconButton">
      <img src="assets/stop.png" alt="Stop">
    </button>
  </div>

  <!-- =========================
       TOPIC SELECTION
  ========================== -->
  <div id="topicScreen">

    <h1>Build Sentences</h1>
    <h2>Choose a Topic</h2>

    <div id="topicGrid">

      <button class="topicBtn" data-topic="animals">
        <img src="assets/topics/animals.png" alt="Animals">
        <span>Animals</span>
      </button>

      <button class="topicBtn" data-topic="food">
        <img src="assets/topics/food.png" alt="Food">
        <span>Food</span>
      </button>

      <button class="topicBtn" data-topic="family">
        <img src="assets/topics/family.png" alt="Family">
        <span>Family</span>
      </button>

      <button class="topicBtn" disabled>
        <img src="assets/topics/emotions.png" alt="Emotions">
        <span>Emotions<br>Coming Soon</span>
      </button>

      <button class="topicBtn" data-topic="mixed">
        <img src="assets/topics/mixed.png" alt="Mixed">
        <span>Mixed Topics</span>
      </button>

    </div>

  </div>

  <!-- =========================
       GAME
  ========================== -->
  <div id="gameContainer" style="display:none;">

    <div id="gameArea">

      <div id="draggablesLeft" class="draggables"></div>

      <div id="centerArea">

        <div id="questionArea">
          <div id="sentenceRow1" class="sentence-row"></div>
          <div id="sentenceRow2" class="sentence-row"></div>
          <div id="sentenceRow3" class="sentence-row"></div>
        </div>

        <div id="answerArea"></div>

        <div id="feedback"></div>

        <div id="controls">
          <button id="checkBtn" class="controlButton">
            <img src="assets/check.png" alt="Check">
          </button>
        </div>

      </div>

      <div id="draggablesRight" class="draggables"></div>

    </div>

    <!-- Verb Draggables -->
    <div id="verbDraggables" class="draggables-bottom"></div>

  </div>

  <!-- =========================
       END MODAL
  ========================== -->
  <div id="endModal" class="modal">
    <div class="modal-content">

      <img id="endGif" src="" alt="Celebration">

      <p>Time: <span id="finalTime"></span></p>
      <p>Score: <span id="finalScore"></span></p>
      <p>Percentage: <span id="finalPercent"></span></p>

      <button id="finishBtn" class="modalButton">
        <img src="assets/finish.png" alt="Finish">
      </button>

      <button id="againBtnEnd" class="modalButton">
        <img src="assets/again.png" alt="Play Again">
      </button>

    </div>
  </div>

  <!-- =========================
       STOP MODAL
  ========================== -->
  <div id="stopModal" class="modal">
    <div class="modal-content">

      <h2 id="stopPercent">Score so far: 0%</h2>

      <div class="modal-buttons">

        <button id="continueBtn" class="modalButton">
          <img src="assets/continue.png" alt="Continue">
        </button>

        <button id="againBtnStop" class="modalButton">
          <img src="assets/again.png" alt="Again">
        </button>

        <button id="finishBtnStop" class="modalButton">
          <img src="assets/finish.png" alt="Finish">
        </button>

      </div>

    </div>
  </div>

  <!-- =========================
       RESUME MODAL
  ========================== -->
  <div id="resumeModal" class="modal">
    <div class="modal-content">

      <p id="resumeMessage"></p>

      <div class="modal-buttons">

        <button id="resumeContinue" class="modalButton">
          <img src="assets/continue.png" alt="Continue">
        </button>

        <button id="resumeAgain" class="modalButton">
          <img src="assets/again.png" alt="Start Over">
        </button>

      </div>

    </div>
  </div>

  <!-- =========================
       HIDDEN GOOGLE FORM
  ========================== -->
  <form
    id="googleForm"
    action="https://docs.google.com/forms/d/e/1FAIpQLSeDjoRouuIIrum-BbkNWt7Rz-ALVAnupFI4RIWbuQulNH9NGw/formResponse"
    method="POST"
    target="hidden_iframe"
    style="display:none;">

  </form>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <script defer src="script.js"></script>

</body>
</html>
